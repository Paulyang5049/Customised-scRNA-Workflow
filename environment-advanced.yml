name: scrna-workflow-advanced
channels:
  - conda-forge
  - bioconda
  - pytorch
  - nodefaults
dependencies:
  - python=3.11
  - scanpy=1.11.*
  - anndata=0.11.*
  - numpy=2.1.*
  - scipy=1.14.*
  - pandas=2.2.*
  - matplotlib=3.9.*
  - seaborn=0.13.*
  - scikit-learn=1.5.*
  - scikit-misc=0.5.*
  - python-igraph=0.11.*
  - leidenalg=0.10.*
  - harmonypy=0.0.10
  - h5py=3.12.*
  - pyyaml=6.*
  - jinja2=3.1.*
  - pytorch>=2.3
  - r-base=4.4.*
  - r-matrix
  - rpy2=3.6.*
  - bioconductor-biocparallel
  - bioconductor-singlecellexperiment
  - bioconductor-scdblfinder
  - bioconductor-scran
  - bioconductor-scry
  - r-soupx=1.6.*
  - pip
  - pip:
      - bbknn==1.6.0
      - scvi-tools==1.2.2
      - scvelo==0.3.3
      - celltypist==1.6.3
      - decoupler==1.8.0
      - liana==1.5.1
      - pertpy==0.10.0
